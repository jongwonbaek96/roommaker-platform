<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>촬영을 시작합니다 </title>
<style>
/* ============================================================
   촬영을 시작합니다 — 준형이 편 (폐병원 온라인 방탈출 MVP)
   1차 vibe-coding 빌드 : 실사 이미지/영상 0장.
   모든 씬은 CSS/SVG 목업. ASSETS[slotId] 채우면 실사로 자동 전환.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
     color:#cfe0dc;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#phone{position:relative;width:100%;max-width:440px;height:100%;overflow:hidden;background:#050807}

/* ===== §3.2 무드 CSS 툴킷 ===== */
:root{
  /* 목업 색상 자체가 이미 청록 계열이라 hue-rotate 하지 않는다(보라색으로 틀어짐) */
  --tone-teal:saturate(1.12) brightness(1.0) contrast(1.06);
  /* 위험 구간(무속실·102호) : 필터 대신 블렌드 오버레이로 붉게 — 필터는 색이 틀어진다 */
  --tone-red:saturate(1.05) brightness(.95) contrast(1.06);
}
#scene{position:absolute;inset:0;overflow:hidden}
.scene-bg{position:absolute;inset:0;overflow:hidden}
.scene-bg img,.scene-bg video{width:100%;height:100%;object-fit:cover}
.scene-bg.css-mock{background:radial-gradient(ellipse at 50% 42%,#2b423d 0%,#0d1413 80%);
  filter:var(--tone-teal);transform:scale(1.04);border-radius:4%}
.scene-bg.css-mock.tone-red{filter:var(--tone-red);background:radial-gradient(ellipse at 50% 46%,#4a2422 0%,#140807 82%)}
.scene-bg.css-mock.tone-red:after{content:'';position:absolute;inset:0;pointer-events:none;
  background:#a8121c;mix-blend-mode:color;opacity:.62}
.scene-bg.css-mock.tone-night{filter:saturate(1.05) brightness(.92);background:linear-gradient(#060a16,#01030a 70%)}
.scene-bg.css-mock.tone-flat{filter:none;transform:none;border-radius:0}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.82) 100%)}
#grain{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:overlay;opacity:.3;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  animation:grain .5s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(-2%,1%)}100%{transform:translate(1%,-2%)}}
.flicker{animation:flk 4.2s infinite}
@keyframes flk{0%,19%,21%,23%,80%,100%{opacity:1}20%,22%,24%{opacity:.3}}
.flicker-fast{animation:flk2 .28s infinite}
@keyframes flk2{0%,100%{opacity:1}50%{opacity:.2}}
.silhouette{position:absolute;background:#03050a;filter:blur(7px);opacity:.96;
  border-radius:50% 44% 52% 46%/44% 50% 42% 54%;
  box-shadow:0 0 0 2px rgba(160,220,210,.12),0 0 20px 2px rgba(0,0,0,.55)}
.sil-head{position:absolute;background:#000;filter:blur(4px);border-radius:50%}

/* ===== 폰 카메라 UI ===== */
#statusbar{position:absolute;top:0;left:0;right:0;height:34px;display:none;align-items:center;
  justify-content:space-between;padding:0 14px;font-size:11.5px;letter-spacing:.3px;
  color:#e7f2ef;text-shadow:0 1px 3px #000;z-index:30;font-variant-numeric:tabular-nums}
#statusbar.on{display:flex}
#recdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff2f2f;margin-right:6px;
  animation:recblink 1.4s infinite;vertical-align:-1px}
@keyframes recblink{0%,49%{opacity:1}50%,100%{opacity:.15}}
#sb-right{display:flex;gap:9px;align-items:center;opacity:.9}
.sig{display:inline-flex;align-items:flex-end;gap:1.5px;height:10px}
.sig i{width:2.5px;background:#e7f2ef;display:block;border-radius:1px}
.sig i:nth-child(1){height:3px}.sig i:nth-child(2){height:5px}.sig i:nth-child(3){height:7px}.sig i:nth-child(4){height:10px}
.sig.none i{background:#5d6b68;opacity:.5}
.sig.none:after{content:'';position:absolute;width:16px;height:1.5px;background:#ff5252;transform:rotate(-32deg)}
.sig{position:relative}
#vf{position:absolute;inset:44px 16px 92px;pointer-events:none;z-index:28;display:none}
#vf.on{display:block}
#vf:before,#vf:after,#vf i:before,#vf i:after{content:'';position:absolute;width:20px;height:20px;
  border:1.6px solid rgba(231,242,239,.55)}
#vf:before{top:0;left:0;border-right:0;border-bottom:0}
#vf:after{top:0;right:0;border-left:0;border-bottom:0}
#vf i:before{bottom:0;left:0;border-right:0;border-top:0}
#vf i:after{bottom:0;right:0;border-left:0;border-top:0}
#vf i{position:absolute;inset:0}

/* ===== 자막 / 힌트 ===== */
#subwrap{position:absolute;left:0;right:0;bottom:0;padding:0 18px 26px;z-index:34;pointer-events:none}
#subtitle{min-height:0;font-size:15px;line-height:1.62;letter-spacing:-.2px;color:#eef6f4;
  text-shadow:0 2px 8px #000,0 0 22px rgba(0,0,0,.9);white-space:pre-wrap}
#subtitle.narr{color:#a8bdb8;font-style:italic}
#subtitle.sys{color:#ffd9d9;text-align:center;font-size:17px;letter-spacing:2px}
#taphint{margin-top:10px;font-size:11px;opacity:0}
#taphint{color:#8ea6a1;transition:opacity .4s;text-align:right}
#taphint.on{opacity:.75;animation:bob 1.6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* ===== 버튼 / 공통 ===== */
.btn{appearance:none;border:1px solid rgba(180,220,212,.35);background:rgba(10,20,18,.72);
  color:#dff0ec;padding:11px 18px;border-radius:10px;font-size:14px;font-family:inherit;
  letter-spacing:-.2px;cursor:pointer;backdrop-filter:blur(3px)}
.btn:active{transform:translateY(1px);background:rgba(30,50,46,.8)}
.btn.warn{border-color:rgba(255,120,120,.45);color:#ffd7d7}
.hot{position:absolute;cursor:pointer}
.hot.pulse:after{content:'';position:absolute;inset:-10px;border:1.5px dashed rgba(190,255,242,.35);
  border-radius:12px;animation:hp 2.2s infinite}
@keyframes hp{0%,100%{opacity:.15}50%{opacity:.6}}

/* ===== 좌우 선택 ===== */
#choices{position:absolute;inset:0;z-index:32;display:none}
#choices.on{display:block}
.chbtn{position:absolute;top:50%;transform:translateY(-50%);width:84px;height:84px;border-radius:50%;
  border:1.5px solid rgba(200,240,232,.4);background:rgba(6,14,12,.55);color:#e6f5f1;font-size:30px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(2px)}
.chbtn:active{background:rgba(40,70,64,.7)}
#chL{left:22px}#chR{right:22px}

/* ===== 모달 (정답 입력) ===== */
#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.82);backdrop-filter:blur(2px);padding:18px}
#modal.on{display:flex}
.mbox{width:100%;max-width:330px;background:linear-gradient(#141c1a,#0a100f);
  border:1px solid rgba(160,210,200,.28);border-radius:14px;padding:18px 16px 16px;box-shadow:0 18px 50px #000}
.mtitle{font-size:13px;color:#9fb8b2;letter-spacing:.4px;margin-bottom:10px;text-align:center}
.mdisp{height:52px;border:1px solid rgba(160,210,200,.25);border-radius:9px;background:#05100e;
  display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:8px;
  font-variant-numeric:tabular-nums;color:#dff7f0;margin-bottom:12px}
.mdisp.shake{animation:shk .4s}
.mdisp input{width:100%;height:100%;background:transparent;border:0;outline:0;text-align:center;
  font-size:22px;letter-spacing:2px;color:#dff7f0;font-family:inherit}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:48px;border-radius:9px;border:1px solid rgba(160,210,200,.22);background:rgba(20,32,30,.9);
  color:#dff0ec;font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-variant-numeric:tabular-nums}
.key:active{background:rgba(48,74,68,.95)}
.key.wide{grid-column:span 1;font-size:13px}
.mmsg{min-height:18px;margin-top:9px;font-size:12px;text-align:center;color:#ff9c9c}
.mclose{margin-top:10px;text-align:center}

/* ===== 카톡 ===== */
#kakao{position:absolute;inset:0;z-index:70;display:none;background:#0d1210;padding:52px 12px 20px}
#kakao.on{display:block}
#kakao.banner{background:transparent;inset:auto 0 auto 0;top:0;padding:40px 10px 0;pointer-events:none}
.kk-head{text-align:center;font-size:13px;color:#8ea6a1;margin-bottom:12px}
.kk-list{display:flex;flex-direction:column;gap:9px;overflow:hidden;max-height:calc(100% - 60px)}
.kk{max-width:78%;padding:9px 12px;border-radius:13px;font-size:13.5px;line-height:1.45;
  animation:pop .22s ease-out;word-break:break-all}
.kk .nm{display:block;font-size:11px;color:#8ea6a1;margin-bottom:3px}
.kk.them{align-self:flex-start;background:#1e2a27;color:#e4efec;border-top-left-radius:4px}
.kk.me{align-self:flex-end;background:#f5e14c;color:#1a1a1a;border-top-right-radius:4px}
.kk.sys{align-self:center;background:transparent;color:#6f837f;font-size:11.5px}
.kk.ghost{align-self:flex-start;background:#2a1a1a;color:#ffd5d5;border-top-left-radius:4px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kk-banner{margin:0 auto;max-width:330px;background:rgba(22,30,28,.95);border-radius:12px;padding:9px 13px;
  box-shadow:0 8px 26px #000;animation:drop .3s;pointer-events:none}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.kk-banner .nm{font-size:11px;color:#9ab0ab}
.kk-banner .tx{font-size:13.5px;color:#eef6f4;margin-top:2px}
#kkNext{position:absolute;left:0;right:0;bottom:16px;text-align:center}

/* ===== 가방(단서 보관) ===== */
#bagbtn{position:absolute;right:12px;bottom:18px;z-index:36;width:44px;height:44px;border-radius:12px;
  border:1px solid rgba(180,220,212,.3);background:rgba(8,16,14,.7);color:#dff0ec;display:none;
  align-items:center;justify-content:center;font-size:19px;cursor:pointer}
#bagbtn.on{display:flex}
#bag{position:absolute;inset:0;z-index:64;display:none;background:rgba(3,7,6,.95);padding:46px 16px 16px;overflow:auto}
#bag.on{display:block}
.bag-t{font-size:13px;color:#9fb8b2;margin-bottom:12px;text-align:center;letter-spacing:.4px}
.bag-item{border:1px solid rgba(160,210,200,.2);border-radius:11px;padding:12px;margin-bottom:10px;background:#0a1211}
.bag-item h4{margin:0 0 7px;font-size:13.5px;color:#dff0ec;font-weight:600}
.bag-item p{margin:0;font-size:12px;line-height:1.55;color:#9fb8b2;white-space:pre-wrap}
.morse-tbl{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;font-size:11px;color:#bcd3ce;
  font-variant-numeric:tabular-nums}
.morse-tbl b{color:#eef6f4;font-weight:600}

/* ===== FX 오버레이 ===== */
.ov{position:absolute;inset:0;pointer-events:none;z-index:80;opacity:0}
#blackov{background:#000;transition:opacity .35s}
#redov{background:radial-gradient(ellipse at center,rgba(255,0,0,.06),rgba(140,0,0,.5));transition:opacity .45s}
#whiteov{background:#fff;transition:opacity .25s}
#flickov{background:rgba(255,255,255,.07)}
#noiseov{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23m)'/></svg>");
  mix-blend-mode:screen;transition:opacity .2s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}
60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,4px)}}
.shake{animation:shk .45s}
.shake-long{animation:shk .45s 3}
@keyframes gl{0%,100%{filter:none;transform:none}
20%{filter:hue-rotate(60deg) saturate(3);transform:translateX(-4px) skewX(3deg)}
40%{filter:invert(.15) contrast(2);transform:translateX(5px)}
60%{filter:hue-rotate(-40deg);transform:translateX(-2px) skewX(-2deg)}}
.glitching #scene{animation:gl .5s}
/* --- 귀신이 화면을 낚아채는 컷 --- */
@keyframes grabin{from{opacity:0}to{opacity:1}}
@keyframes grabrush{0%{transform:scale(.3) translateY(30%);opacity:.2;filter:blur(11px)}
55%{transform:scale(1.05) translateY(2%);opacity:.96;filter:blur(3px)}
100%{transform:scale(2.7) translateY(-10%);opacity:1;filter:blur(1px)}}
@keyframes grabhand{0%{transform:translate(48%,72%) rotate(28deg) scale(.55);opacity:0}
24%{opacity:1}
72%{transform:translate(2%,6%) rotate(-4deg) scale(1.35);opacity:1}
100%{transform:translate(-4%,-6%) rotate(-10deg) scale(1.9);opacity:1}}
@keyframes grabclaw{0%{opacity:0;transform:translateX(34%) scaleX(.2)}
40%{opacity:.95}
100%{opacity:0;transform:translateX(-30%) scaleX(1.6)}}
.grabov{position:absolute;inset:0;z-index:79;overflow:hidden;pointer-events:auto;
  background:radial-gradient(ellipse at 50% 42%,rgba(150,200,195,.26) 0%,rgba(10,17,16,.82) 34%,#000 76%);
  animation:grabin .12s forwards}
.grabglow{position:absolute;left:50%;top:36%;width:86%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(200,240,235,.30),rgba(200,240,235,0) 68%);filter:blur(6px)}
.grabfig{position:absolute;inset:0;transform-origin:50% 62%;animation:grabrush .62s cubic-bezier(.22,.9,.3,1) forwards}
.grabhand{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 62%;
  animation:grabhand .5s cubic-bezier(.3,.7,.2,1) .40s both}
.grabclaw{position:absolute;left:-10%;width:120%;height:8px;border-radius:8px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,238,238,.92),rgba(255,110,110,.3),rgba(255,255,255,0));
  filter:blur(1.5px);animation:grabclaw .42s ease-out .62s both}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:78;
  background:rgba(8,16,14,.92);border:1px solid rgba(160,210,200,.28);border-radius:10px;
  padding:9px 15px;font-size:12.5px;color:#dff0ec;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

/* ===== 타이틀 ===== */
#title{position:absolute;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:30px}
#title h1{margin:0;font-size:27px;letter-spacing:6px;color:#e9f4f1;text-align:center;font-weight:700;
  text-shadow:0 0 30px rgba(120,220,200,.25)}
#title .sub{font-size:12.5px;color:#7d918d;letter-spacing:3px;margin-top:-6px}
#title .tag{font-size:12px;color:#6d817d;text-align:center;line-height:1.7;margin-top:6px}
#title .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
#title .note{position:absolute;bottom:18px;font-size:10.5px;color:#4e5f5c;text-align:center;padding:0 24px;line-height:1.6}

/* ===== 미니게임 공용 ===== */
#pzlayer{position:absolute;inset:0;z-index:26}
.pz-title{position:absolute;top:44px;left:0;right:0;text-align:center;font-size:12px;color:#9fb8b2;
  letter-spacing:.6px;text-shadow:0 1px 4px #000;z-index:5}
.pz-help{position:absolute;bottom:74px;left:0;right:0;text-align:center;font-size:11.5px;color:#89a09b;
  text-shadow:0 1px 4px #000;padding:0 22px;line-height:1.5;z-index:5}
canvas{display:block;touch-action:none}
.bar{position:absolute;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:#67e8c6;transition:width .12s linear}
.bar.danger i{background:#ff5a5a}
</style>
</head>
<body>
<div id="app"><div id="phone">
  <div id="scene"></div>
  <div id="pzlayer"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="vf"><i></i></div>
  <div id="statusbar">
    <div><span id="recdot"></span><span id="rectime">00:00</span></div>
    <div id="sb-right">
      <span id="clock">23:41</span>
      <span class="sig" id="sig"><i></i><i></i><i></i><i></i></span>
      <span id="batt">87%</span>
    </div>
  </div>
  <div id="choices"><button class="chbtn" id="chL">◀</button><button class="chbtn" id="chR">▶</button></div>
  <div id="subwrap"><div id="subtitle"></div><div id="taphint">화면을 탭</div></div>
  <button id="bagbtn">🎒</button>
  <div id="bag"></div>
  <div id="kakao"></div>
  <div id="modal"></div>
  <div id="toast"></div>
  <div class="ov" id="noiseov"></div>
  <div class="ov" id="flickov"></div>
  <div class="ov" id="redov"></div>
  <div class="ov" id="whiteov"></div>
  <div class="ov" id="blackov"></div>
  <div id="title">
    <h1>촬영을 시작합니다</h1>
    <div class="btns">
      <button class="btn" id="btnNew">처음부터</button>
      <button class="btn" id="btnCont" style="display:none">이어하기</button>
    </div>
    <div class="note">이어폰 착용을 권장합니다 · 소리가 납니다<br>1차 빌드 — 이미지/영상 미삽입(CSS 목업)</div>
  </div>
</div></div>
<script>/* matter-js 0.20.0 · MIT · http://brm.io/matter-js/ (물리엔진 내장) */

<script>
/* =========================================================
   PART 2 — 코어 : 자산 슬롯 / 상태 / 오디오 / FX / 자막
   ========================================================= */
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- §3.1 자산 슬롯 ----------
   지금은 전부 비어있음 = CSS 목업 사용.
   나중에 실사가 생기면  ASSETS['lobby-wide'] = 'data:image/jpeg;base64,...'  한 줄만 추가. */
const ASSETS = {};   /* __ASSET_REGISTRY__ */

function bg(slotId, mockHTML, opts){
  opts = opts || {};
  const real = ASSETS[slotId];
  const cls = ['scene-bg'];
  if (opts.tone) cls.push('tone-' + opts.tone);
  if (real){
    return opts.video
      ? `<video class="${cls.join(' ')}" data-slot="${slotId}" src="${real}" autoplay muted playsinline loop></video>`
      : `<div class="${cls.join(' ')}" data-slot="${slotId}"><img src="${real}" alt=""></div>`;
  }
  /* __ASSET_SLOT:${slotId}__ */
  cls.splice(1, 0, 'css-mock');
  return `<div class="${cls.join(' ')}" data-slot="${slotId}">${mockHTML || ''}</div>`;
}
function setScene(slotId, mockHTML, opts){
  $('#scene').innerHTML = bg(slotId, mockHTML, opts);
  return $('#scene').firstChild;
}
/* 목업 조각 헬퍼 */
const D = (style, inner) => `<div style="position:absolute;${style}">${inner||''}</div>`;
const SIL = (style, cls) => `<div class="silhouette ${cls||''}" style="${style}"></div>`;

/* ---------- 상태 / 세이브 ---------- */
const KEY_SAVE = 'jhCam_save';
let S = {
  i: 0,                 // TIMELINE 진행 인덱스
  step: 0,              // 스토리 컷 내부 인덱스
  flags: {},            // 1회성 플래그
  wrongCounts: {},      // 퍼즐별 오답/실패 누적
  dirHistory: {},       // 방향선택 기록(힌트/로깅용)
  items: [],            // 가방
  battery: 87,
  recSec: 0,
  cleared: false
};
function save(){ try{ localStorage.setItem(KEY_SAVE, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY_SAVE)); if(d && typeof d.i === 'number'){ S = Object.assign(S, d); return true; } }catch(e){} return false; }
function wipe(){ try{ localStorage.removeItem(KEY_SAVE); }catch(e){} }

/* ---------- 프로시저럴 오디오 (외부 음원 0개) ---------- */
const AudioFX = {
  ctx:null, master:null, ready:false, hb:null, amb:null,
  init(){
    if(this.ready) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    try{
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.45;
      this.master.connect(this.ctx.destination);
      this.ready = true;
    }catch(e){}
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  t(){ return this.ctx.currentTime; },
  env(g, a, d, peak){
    const t = this.t();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  noiseBuf(sec, brown){
    const n = Math.floor(this.ctx.sampleRate * sec);
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for(let i=0;i<n;i++){
      const w = Math.random()*2-1;
      if(brown){ last = (last + 0.02*w)/1.02; d[i] = last*3.5; } else d[i] = w;
    }
    return b;
  },
  noise(dur, vol, freq, type, brown){
    if(!this.ready) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf(dur, brown);
    const f = this.ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq || 1200;
    const g = this.ctx.createGain();
    s.connect(f); f.connect(g); g.connect(this.master);
    this.env(g, 0.004, dur, vol||0.2);
    s.start(); s.stop(this.t()+dur+0.05);
  },
  tone(freq, dur, type, vol, slideTo){
    if(!this.ready) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, this.t());
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, this.t()+dur);
    o.connect(g); g.connect(this.master);
    this.env(g, 0.006, dur, vol||0.12);
    o.start(); o.stop(this.t()+dur+0.05);
  },
  click(){ this.noise(0.05, 0.12, 2600, 'highpass'); },
  ding(){ this.tone(1180, 0.14, 'sine', 0.14); setTimeout(()=>this.tone(1560, 0.2, 'sine', 0.11), 90); },
  lock(){ this.noise(0.09, 0.3, 500); this.tone(90, 0.12, 'square', 0.1); },     // 덜컥(실패)
  unlock(){ this.tone(520, 0.1, 'triangle', 0.14); setTimeout(()=>this.tone(880, 0.22, 'triangle', 0.13), 100); },
  thud(){ this.noise(0.35, 0.42, 190, 'lowpass', true); this.tone(58, 0.3, 'sine', 0.22, 34); },  // 쾅
  bang(){ this.thud(); setTimeout(()=>this.thud(), 180); setTimeout(()=>this.thud(), 340); },
  bell(v){ const k = v || 1; this.tone(2300, 0.5, 'triangle', 0.09*k); setTimeout(()=>this.tone(3100, 0.35, 'triangle', 0.06*k), 40); },
  roar(){                                                             // 굉음
    if(!this.ready) return;
    this.noise(1.2, 0.5, 240, 'lowpass', true);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(230, this.t());
    o.frequency.exponentialRampToValueAtTime(38, this.t()+1.0);
    o.connect(g); g.connect(this.master); this.env(g, 0.01, 1.1, 0.34);
    o.start(); o.stop(this.t()+1.25);
    this.thud(); setTimeout(()=>this.thud(), 130); setTimeout(()=>this.thud(), 300);
  },
  scream(){                                                           // 끼아악
    if(!this.ready) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(),
          lfo = this.ctx.createOscillator(), lg = this.ctx.createGain(),
          f = this.ctx.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(880, this.t());
    o.frequency.exponentialRampToValueAtTime(1780, this.t()+0.18);
    o.frequency.exponentialRampToValueAtTime(640, this.t()+0.95);
    lfo.type = 'sine'; lfo.frequency.value = 23; lg.gain.value = 150;
    lfo.connect(lg); lg.connect(o.frequency);
    f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 1.1;
    o.connect(f); f.connect(g); g.connect(this.master);
    this.env(g, 0.02, 1.0, 0.3);
    o.start(); lfo.start(); o.stop(this.t()+1.15); lfo.stop(this.t()+1.15);
    this.noise(0.9, 0.22, 2400, 'highpass');
    this.thud();
  },
  step(){ this.noise(0.13, 0.16, 420, 'lowpass', true); },
  stat(){ this.noise(0.5, 0.16, 5200, 'highpass'); },                 // 지지직
  stinger(){
    if(!this.ready) return;
    this.noise(0.9, 0.5, 3000, 'highpass');
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(1400, this.t());
    o.frequency.exponentialRampToValueAtTime(90, this.t()+0.8);
    o.connect(g); g.connect(this.master); this.env(g, 0.01, 0.85, 0.3);
    o.start(); o.stop(this.t()+0.95);
  },
  breath(){ this.noise(1.1, 0.13, 760, 'bandpass', true); },
  heartbeat(bpm){
    if(!this.ready) return;
    this.stopHeart();
    const kick = v => { this.tone(62, 0.16, 'sine', v, 40); };
    const beat = () => { kick(0.26); setTimeout(()=>kick(0.16), 190); };
    beat(); this.hb = setInterval(beat, 60000/(bpm||70));
  },
  stopHeart(){ if(this.hb){ clearInterval(this.hb); this.hb = null; } },
  ambience(on){
    if(!this.ready) return;
    if(!on){ if(this.amb){ try{ this.amb.stop(); }catch(e){} this.amb = null; } return; }
    if(this.amb) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf(4, true); s.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 160;
    const g = this.ctx.createGain(); g.gain.value = 0.085;
    s.connect(f); f.connect(g); g.connect(this.master); s.start();
    this.amb = s;
  }
};

/* ---------- FX ---------- */
function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function blackout(ms, cb){
  const b = $('#blackov'); b.style.transition = 'opacity .18s'; b.style.opacity = 1;
  setTimeout(()=>{ if(cb) cb(); b.style.transition = 'opacity .5s'; b.style.opacity = 0; }, ms || 500);
}
function fadeToBlack(ms){ const b = $('#blackov'); b.style.transition = `opacity ${(ms||600)/1000}s`; b.style.opacity = 1; }
function fadeFromBlack(ms){ const b = $('#blackov'); b.style.transition = `opacity ${(ms||600)/1000}s`; b.style.opacity = 0; }
function whiteflash(){ const w = $('#whiteov'); w.style.opacity = .9; setTimeout(()=>w.style.opacity = 0, 70); }
function redpulse(){ const r = $('#redov'); r.style.opacity = 1; setTimeout(()=>r.style.opacity = 0, 520); }
function flick(times){
  const f = $('#flickov'); let c = 0; const n = times || 6;
  const iv = setInterval(()=>{ f.style.opacity = (c%2 ? 0 : 0.9); if(++c > n){ clearInterval(iv); f.style.opacity = 0; } }, 70);
}
function noiseBurst(ms){
  const n = $('#noiseov'); n.style.opacity = .5;
  setTimeout(()=>{ n.style.opacity = 0; }, ms || 350);
}
function glitchFX(ms){ document.body.classList.add('glitching'); setTimeout(()=>document.body.classList.remove('glitching'), ms || 520); }
function shake(long){
  const p = $('#phone'); p.classList.remove('shake','shake-long');
  void p.offsetWidth;
  p.classList.add(long ? 'shake-long' : 'shake');
  setTimeout(()=>p.classList.remove('shake','shake-long'), long ? 1400 : 460);
}
function jumpscare(scale){
  AudioFX.stinger(); glitchFX(700); shake(true); vibrate([90,40,180]); redpulse();
  const ov = document.createElement('div');
  ov.style.cssText = 'position:absolute;inset:0;z-index:76;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 8%,rgba(0,0,0,.2) 40%,#000 74%)';
  ov.innerHTML =
    SIL('left:50%;top:46%;width:74%;height:62%;transform:translate(-50%,-50%) scale(' + (scale||1) + ');filter:blur(9px);opacity:.96') +
    D('left:40%;top:38%;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 22px 7px rgba(255,255,255,.55)') +
    D('left:57%;top:38%;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 22px 7px rgba(255,255,255,.55)');
  $('#phone').appendChild(ov);
  setTimeout(()=>ov.remove(), 900);
}

function ghostGrab(opt){
  opt = opt || {};
  return new Promise(res => {
    AudioFX.resume();
    if(opt.scream) AudioFX.scream(); else AudioFX.roar();
    glitchFX(900); shake(true); vibrate([130,60,240]); noiseBurst(520);
    const ov = document.createElement('div');
    ov.className = 'grabov';
    ov.innerHTML =
      `<div class="grabglow"></div>` +
      `<div class="grabfig">` +
        ghostFigure({ scale:1.35, top:24, blur:6, opacity:.98, ribbon:true, eyes:true }) +
      `</div>` +
      clawHand() +
      `<div class="grabclaw" style="top:34%"></div>` +
      `<div class="grabclaw" style="top:49%;animation-delay:.66s"></div>` +
      `<div class="grabclaw" style="top:63%;animation-delay:.70s"></div>`;
    $('#phone').appendChild(ov);
    setTimeout(()=>{ AudioFX.thud(); whiteflash(); redpulse(); shake(true); vibrate(160); }, 640);
    setTimeout(()=>{ fadeToBlack(200); }, 900);
    setTimeout(()=>{
      ov.remove(); fadeFromBlack(420);
      if(opt.toast) toast(opt.toast);
      res();
    }, 1280);
  });
}
let toastT = null;
function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), ms || 1800);
}

/* ---------- 상태바 (폰 카메라 UI) ---------- */
let recTimer = null;
function startRec(){
  $('#statusbar').classList.add('on'); $('#vf').classList.add('on');
  if(recTimer) return;
  recTimer = setInterval(()=>{
    S.recSec++;
    const m = String(Math.floor(S.recSec/60)).padStart(2,'0'), s = String(S.recSec%60).padStart(2,'0');
    $('#rectime').textContent = m + ':' + s;
    if(S.recSec % 25 === 0 && S.battery > 3){ S.battery--; $('#batt').textContent = S.battery + '%'; }
    if(S.recSec % 60 === 0){
      const base = 23*60 + 41 + Math.floor(S.recSec/60);
      $('#clock').textContent = String(Math.floor(base/60)%24).padStart(2,'0') + ':' + String(base%60).padStart(2,'0');
    }
  }, 1000);
  $('#batt').textContent = S.battery + '%';
}
function killSignal(){ $('#sig').classList.add('none'); }

/* ---------- 자막 타이핑 ---------- */
let typeToken = 0, typing = false;
function typeInto(text, cls, speed){
  return new Promise(resolve => {
    const el = $('#subtitle');
    el.className = cls || '';
    const tk = ++typeToken; let i = 0; el.textContent = ''; typing = true;
    const sp = speed || 32;
    const iv = setInterval(()=>{
      if(tk !== typeToken){ clearInterval(iv); return; }
      el.textContent = text.slice(0, ++i);
      if(i >= text.length){ clearInterval(iv); typing = false; resolve(); }
    }, sp);
    typeSkip = () => { if(tk !== typeToken) return; clearInterval(iv); el.textContent = text; typing = false; resolve(); };
  });
}
let typeSkip = () => {};
function clearSub(){ typeToken++; typing = false; $('#subtitle').textContent = ''; $('#subtitle').className = ''; }
function showTapHint(on){ $('#taphint').classList.toggle('on', !!on); }

/* ---------- 탭 대기 ---------- */
function waitTap(){
  return new Promise(resolve => {
    showTapHint(true);
    const h = (e) => {
      if(e.target.closest('.btn,.chbtn,.key,.hot,#bagbtn,#bag,#modal,#kakao')) return;
      $('#phone').removeEventListener('pointerdown', h);
      showTapHint(false); AudioFX.click(); resolve();
    };
    setTimeout(()=>$('#phone').addEventListener('pointerdown', h), 60);
  });
}
/* 대사 한 줄 출력 → 탭 대기 (타이핑 중 탭하면 즉시 완성) */
async function line(text, cls){
  const p = typeInto(text, cls);
  let done = false; p.then(()=>done = true);
  await new Promise(resolve => {
    const h = (e) => {
      if(e.target.closest('.btn,.chbtn,.key,.hot,#bagbtn,#bag,#modal,#kakao')) return;
      if(!done){ typeSkip(); return; }
      $('#phone').removeEventListener('pointerdown', h);
      showTapHint(false); AudioFX.click(); resolve();
    };
    $('#phone').addEventListener('pointerdown', h);
    p.then(()=>showTapHint(true));
  });
}
/* 자동으로 흘러가는 한 줄 (탭 없이) */
async function autoLine(text, cls, hold){
  await typeInto(text, cls);
  await wait(hold || 1200);
}

/* ---------- 공통 목업 빌더 (CSS/SVG만, 사진 0장) ---------- */
/* 원근 복도 : 중첩 사각형으로 소실점 표현 */
function corridorMock(o){
  o = o || {};
  const depth = o.depth || 7;
  let h = '';
  h += D('inset:0;background:linear-gradient(180deg,#162523 0%,#101c1a 55%,#080e0d 100%)');
  for(let i=0;i<depth;i++){
    const p = i/depth, inset = 6 + p*36;
    h += D(`left:${inset}%;right:${inset}%;top:${8+p*30}%;bottom:${10+p*32}%;
      border:1px solid rgba(170,240,225,${0.34 - p*0.035});box-shadow:inset 0 0 26px rgba(0,0,0,.45)`);
  }
  // 천장 형광등 2개
  h += D('left:44%;width:12%;top:9%;height:4px;background:rgba(200,255,245,.5);filter:blur(1px)',
         '') ;
  h += `<div class="flicker" style="position:absolute;left:41%;width:18%;top:20%;height:3px;background:rgba(190,250,240,.42);filter:blur(2px)"></div>`;
  // 바닥 반사
  h += D('left:24%;right:24%;bottom:12%;height:22%;background:linear-gradient(180deg,rgba(120,200,190,.06),transparent)');
  if(o.doorRight) h += D('right:9%;top:34%;width:13%;height:30%;border:1px solid rgba(160,220,210,.3);background:rgba(4,10,9,.75)');
  if(o.doorEnd)  h += D('left:44%;top:36%;width:12%;height:22%;border:1px solid rgba(180,235,222,.45);background:rgba(3,8,7,.9)',
                        D('left:50%;top:10%;transform:translateX(-50%);font-size:7px;color:rgba(200,240,232,.7);letter-spacing:1px','102'));
  if(o.split){
    h += D('left:28%;top:34%;width:16%;height:28%;background:#030706;border:1px solid rgba(175,235,222,.38)');
    h += D('right:28%;top:34%;width:16%;height:28%;background:#030706;border:1px solid rgba(175,235,222,.38)');
  }
  if(o.ghost){
    const g = o.ghost; // 0(멀다)~1(가깝다)
    h += ghostFigure({ scale: 0.35 + g*1.9, top: 40 - g*4, blur: 3 + g*6, opacity: 0.55 + g*0.42 });
  }
  if(o.bells){
    for(let i=0;i<14;i++){
      const y = 16 + (i%7)*10, x = i<7 ? 10 : 84;
      h += D(`left:${x}%;top:${y}%;width:7px;height:7px;border-radius:50%;
        background:radial-gradient(circle at 35% 30%,#cfd8c8,#5a6357);opacity:.8`);
    }
  }
  return h;
}
/* 방 : 뒷벽 + 바닥 + 오브젝트 */
function roomMock(inner, o){
  o = o || {};
  let h = '';
  h += D('inset:0;background:linear-gradient(180deg,#1d302c 0%,#13211f 62%,#0a1211 100%)');
  h += D('left:6%;right:6%;top:12%;height:52%;border:1px solid rgba(170,235,220,.22);box-shadow:inset 0 0 60px rgba(0,0,0,.5)');
  h += D('left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))');
  if(o.lamp) h += `<div class="flicker" style="position:absolute;left:38%;width:24%;top:10%;height:4px;background:rgba(200,250,240,.5);filter:blur(2px)"></div>`;
  return h + (inner || '');
}

/* 사람 형체(머리+몸통) — 사진 없이 '누가 서 있다'를 읽히게 */
function ghostFigure(o){
  o = o || {};
  const sc = o.scale || 1, blur = o.blur || 6, top = o.top || 44;
  const bw = 13 * sc, bh = 32 * sc, hd = 9.5 * sc;
  const x = o.x || 50;
  let h = '';
  /* 몸통 : 어깨에서 아래로 살짝 퍼지는 형태 */
  h += SIL(`left:${x}%;top:${top}%;width:${bw}%;height:${bh}%;transform:translateX(-50%);filter:blur(${blur}px);
    opacity:${o.opacity || .96};border-radius:42% 42% 22% 22%/26% 26% 8% 8%`);
  /* 어깨 */
  h += SIL(`left:${x}%;top:${top + bh*0.05}%;width:${bw*1.75}%;height:${bh*0.22}%;transform:translateX(-50%);
    filter:blur(${blur*1.15}px);opacity:${(o.opacity || .96)*0.92};border-radius:52% 52% 38% 38%`);
  /* 머리 (목 간격을 두고 확실히 분리) */
  const headBox = `left:${x}%;top:${top - hd*0.92}%;transform:translateX(-50%);width:${hd}%;aspect-ratio:.86;`;
  h += D(headBox + `border-radius:50%;
    background:#03050a;filter:blur(${blur*0.55}px);box-shadow:0 0 0 2px rgba(160,220,210,.12),0 0 14px 2px rgba(0,0,0,.55)`);
  /* 눈 (머리 박스 기준 — 크기·위치가 항상 얼굴에 맞는다) */
  if(o.eyes){
    const eye = 'width:19%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 16px 6px rgba(255,235,235,.75)';
    h += D(headBox, D('left:20%;top:42%;' + eye) + D('left:61%;top:42%;' + eye));
  }
  if(o.ribbon) h += ribbonMock(x + hd*0.72, top - hd*1.30, hd * 1.25);
  return h;
}
function ribbonMock(x, y, w){
  return D(`left:${x}%;top:${y}%;transform:translate(-50%,-50%);width:${w}%;aspect-ratio:1.9`,
    `<svg viewBox="0 0 44 26" style="width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,50,70,.9))">

       <path d="M24 14 L30 25 L23 20 Z" fill="#a50f1c"/>

}

function kakaoFull(title, msgs){
  return new Promise(resolve => {
    const k = $('#kakao');
    k.className = 'on';
    k.innerHTML = `<div class="kk-head">${title}</div><div class="kk-list" id="kkList"></div><div id="kkNext"></div>`;
    const list = $('#kkList');
    let i = 0;
    const step = () => {
      if(i >= msgs.length){
        const btn = document.createElement('button');
        btn.className = 'btn'; btn.textContent = msgs.doneLabel || '계속';
        btn.onclick = () => { k.className = ''; k.innerHTML = ''; AudioFX.click(); resolve(); };
        $('#kkNext').appendChild(btn);
        return;
      }
      const m = msgs[i++];
      const b = document.createElement('div');
      b.className = 'kk ' + (m.who || 'them');
      b.innerHTML = (m.nm ? `<span class="nm">${m.nm}</span>` : '') + (m.tx || '');
      list.appendChild(b);
      if(m.who !== 'sys') AudioFX.ding();
      if(m.fx === 'shake') shake();
      list.scrollTop = list.scrollHeight;
      setTimeout(step, m.delay || 780);
    };
    setTimeout(step, 420);
  });
}

/* ---------- 정답 입력 모달 ---------- */
function closeModal(){ $('#modal').className = ''; $('#modal').innerHTML = ''; }
/* 숫자 키패드 : answer(문자열) 일치 시 resolve(true), 닫으면 resolve(false) */
function askNumber(opt){
  return new Promise(resolve => {
    const m = $('#modal');
    let buf = '';
    m.className = 'on';
    m.innerHTML = `<div class="mbox">
      <div class="mtitle">${opt.title || '잠금 해제'}</div>
      <div class="mdisp" id="mdisp"></div>
      <div class="keys" id="keys"></div>
      <div class="mmsg" id="mmsg">${opt.hint || ''}</div>
      <div class="mclose"><button class="btn" id="mx">닫기</button></div></div>`;
    const disp = $('#mdisp'), msg = $('#mmsg');
    const render = () => { disp.textContent = buf.padEnd(opt.len || 4, '·'); };
    render();
    const keys = $('#keys');
    ['1','2','3','4','5','6','7','8','9','←','0','✓'].forEach(k => {
      const b = document.createElement('div');
      b.className = 'key' + (k.length > 1 || k === '←' || k === '✓' ? ' wide' : '');
      b.textContent = k;
      b.onclick = () => {
        AudioFX.click();
        if(k === '←'){ buf = buf.slice(0,-1); render(); return; }
        if(k === '✓'){ submit(); return; }
        if(buf.length < (opt.len || 4)){ buf += k; render(); if(buf.length === (opt.len||4)) setTimeout(submit, 220); }
      };
      keys.appendChild(b);
    });
    const submit = () => {
      if(buf === String(opt.answer)){
        AudioFX.unlock(); msg.style.color = '#7fe9cf'; msg.textContent = '…열렸다.';
        setTimeout(()=>{ closeModal(); resolve(true); }, 620);
      }else{
        AudioFX.lock(); disp.classList.add('shake'); vibrate(60);
        msg.style.color = '#ff9c9c'; msg.textContent = opt.wrongMsg || '덜컥. 열리지 않는다.';
        S.wrongCounts[opt.id] = (S.wrongCounts[opt.id] || 0) + 1;
        if(opt.onWrong) opt.onWrong(S.wrongCounts[opt.id]);
        setTimeout(()=>{ disp.classList.remove('shake'); buf = ''; render(); }, 420);
      }
    };
    $('#mx').onclick = () => { AudioFX.click(); closeModal(); resolve(false); };
  });
}
/* 텍스트 입력 : answers 배열 중 하나와 일치(공백/대소문자 무시) */
function askText(opt){
  return new Promise(resolve => {
    const m = $('#modal');
    m.className = 'on';
    m.innerHTML = `<div class="mbox">
      <div class="mtitle">${opt.title || '입력'}</div>
      <div class="mdisp"><input id="mtxt" autocomplete="off" spellcheck="false" placeholder="${opt.placeholder || ''}"></div>
      <div style="display:flex;gap:8px"><button class="btn" id="mok" style="flex:1">확인</button>
      <button class="btn" id="mx" style="flex:1">닫기</button></div>
      <div class="mmsg" id="mmsg">${opt.hint || ''}</div></div>`;
    const inp = $('#mtxt'), msg = $('#mmsg');
    setTimeout(()=>inp.focus(), 120);
    const norm = s => String(s).replace(/\s/g,'').toUpperCase();
    const submit = () => {
      const v = norm(inp.value);
      if(!v) return;
      if(opt.answers.some(a => norm(a) === v)){
        AudioFX.unlock(); msg.style.color = '#7fe9cf'; msg.textContent = '…맞다.';
        setTimeout(()=>{ closeModal(); resolve(true); }, 600);
      }else{
        AudioFX.lock(); vibrate(60); $('.mdisp').classList.add('shake');
        msg.style.color = '#ff9c9c'; msg.textContent = opt.wrongMsg || '아무 일도 일어나지 않는다.';
        S.wrongCounts[opt.id] = (S.wrongCounts[opt.id] || 0) + 1;
        if(opt.onWrong) opt.onWrong(S.wrongCounts[opt.id]);
        setTimeout(()=>{ $('.mdisp').classList.remove('shake'); inp.value = ''; }, 420);
      }
    };
    $('#mok').onclick = submit;
    inp.onkeydown = e => { if(e.key === 'Enter') submit(); };
    $('#mx').onclick = () => { AudioFX.click(); closeModal(); resolve(false); };
  });
}

/* ---------- 방향선택 컴포넌트 (§4.5 / §4.8) ---------- */
function directionSeq(opt){
  /* opt: {steps, answer:['R','L',...], key, render(stepIndex), onWrong(step), onStep(i)} */
  return new Promise(resolve => {
    let i = 0;
    const picks = [];
    const ch = $('#choices');
    const show = () => { opt.render(i); ch.classList.add('on'); };
    const pick = (dir) => {
      AudioFX.click(); AudioFX.step();
      if(dir === opt.answer[i]){
        picks.push(dir); i++;
        if(i >= opt.steps){
          ch.classList.remove('on');
          S.dirHistory[opt.key] = picks; save();
          $('#chL').onclick = $('#chR').onclick = null;
          resolve(picks);
          return;
        }
        show();
      }else{
        i = 0; picks.length = 0;
        if(opt.onWrong) opt.onWrong();
        show();
      }
    };
    $('#chL').onclick = () => pick('L');
    $('#chR').onclick = () => pick('R');
    show();
  });
}

function fitCanvas(cv){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: r.width, h: r.height, dpr };
}
function ptIn(e, el){ const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  const base = $('#q1base'), text = $('#q1text');

  B.ctx.fillStyle = '#e8ece4'; B.ctx.fillRect(0,0,B.w,B.h);

  Q1_DIGITS.forEach(d => {

    B.ctx.restore();
  });
  /* 지워질 근무표 텍스트 */
  const names = ['金','朴','李','崔','韓','鄭','吳','徐'];
  T.ctx.fillStyle = 'rgba(232,236,228,1)'; T.ctx.fillRect(0,0,T.w,T.h);

  for(let i=0;i<26;i++){
    const y = T.h*(0.12 + i*0.034);

    const nm = names[i % names.length];
    const h1 = String(21 + (i%3)).padStart(2,'0'), m1 = String((i*17)%60).padStart(2,'0');
    const h2 = String(1 + (i%4)).padStart(2,'0'), m2 = String((i*23)%60).padStart(2,'0');
    T.ctx.fillText(`${day}  ${nm}   순찰 ${h1}:${m1} / ${h2}:${m2}   이상없음`, T.w*0.06, y);
  }
  T.ctx.strokeStyle = 'rgba(60,80,80,.3)';
  for(let i=0;i<4;i++){ T.ctx.beginPath(); T.ctx.moveTo(T.w*0.04, T.h*(0.1+i*0.22)); T.ctx.lineTo(T.w*0.96, T.h*(0.1+i*0.22)); T.ctx.stroke(); }

  let hasEraser = false, cleared = false, drawing = false, lastCheck = 0;
  $('#q1eraser').onclick = () => {

    $('#q1eraser').classList.remove('pulse');
    $('#q1eraser').style.boxShadow = '0 0 0 2px rgba(150,255,235,.5),0 6px 16px #000';

    toast('칠판지우개를 들었다');
  };
  const erodeAt = (x,y) => {
    T.ctx.globalCompositeOperation = 'destination-out';
    T.ctx.beginPath(); T.ctx.arc(x, y, Math.max(16, T.w*0.075), 0, Math.PI*2); T.ctx.fill();
    T.ctx.globalCompositeOperation = 'source-over';
  };
  const ratio = () => {
    const img = T.ctx.getImageData(0,0,text.width,text.height).data;
    let on = 0, tot = 0;
    for(let y=0;y<text.height;y+=9) for(let x=0;x<text.width;x+=9){
      const a = img[(y*text.width + x)*4 + 3];
      tot++; if(a > 12) on++;
    }
    return on/tot;
  };
  const check = () => {
    if(cleared) return;
    const r = ratio();
    if(r < 0.12){
      cleared = true;
      AudioFX.stat(); flick(4);

      toast('지워지지 않는 숫자가 남았다');
    }
  };
  const pos = e => ptIn(e, text);
  text.addEventListener('pointerdown', e => {

    const p = pos(e); erodeAt(p.x, p.y);
  });
  text.addEventListener('pointermove', e => {
    if(!drawing) return;
    const p = pos(e); erodeAt(p.x, p.y);
    if(Date.now() - lastCheck > 260){ lastCheck = Date.now(); check(); AudioFX.noise(0.05, 0.05, 900); }
  });
  const up = () => { if(drawing){ drawing = false; check(); } };
  text.addEventListener('pointerup', up);
  text.addEventListener('pointercancel', up);

  $('#q1lock').onclick = async () => {
    AudioFX.click();

  const center = el => {

    return { x: r.left - w.left + r.width/2, y: r.top - w.top + r.height/2 };
  };
  const mk = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k])); return e; };
  const redraw = () => {
    svg.innerHTML = '';
    Object.keys(conn).forEach(wid => {
      const w = WIRES[wid];
      const a = center($(`.wire[data-wire="${wid}"] div`));
      const b = center($(`.sock[data-sock="${conn[wid]}"]`));

  const onMove = e => {

    const w = wrap.getBoundingClientRect();
    temp.setAttribute('x2', e.clientX - w.left); temp.setAttribute('y2', e.clientY - w.top);

    const t = document.elementFromPoint(e.clientX, e.clientY);
    const sock = t && t.closest('.sock');
    temp = null;
    if(sock){
      const key = sock.dataset.sock;
      Object.keys(conn).forEach(k => { if(conn[k] === key) delete conn[k]; });
      conn[drag] = key;
      AudioFX.tone(300, .08, 'square', .1);
    }
    drag = null; redraw();
    if(Object.keys(conn).length === 4){
      setTimeout(()=>{
        if(solved()){
          AudioFX.unlock(); flick(6); AudioFX.stat();
          toast('…전원이 들어온다');
          clearInterval(m1watch); m1cleanup();
          setTimeout(()=>{ clearPZ(); resolve(); }, 900);
        }else{
          AudioFX.lock(); whiteflash(); shake(); vibrate(70);
          toast('스파크 — 자리가 맞지 않는다');
          Object.keys(conn).forEach(k => delete conn[k]);
          S.wrongCounts.M1 = (S.wrongCounts.M1||0) + 1;
          redraw();
        }
      }, 320);
    }
  };
  const m1cleanup = () => {
    $('#pzlayer').removeEventListener('pointerdown', onDown);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  };
  $('#pzlayer').addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  /* 외부(SKIP 등)로 퍼즐이 치워지면 리스너도 정리 */
  const m1watch = setInterval(() => { if(!document.body.contains(wrap)){ clearInterval(m1watch); m1cleanup(); } }, 500);
});}};

/* ---------------------------------------------------------
   MISSION 2 — 통로 「방울길」
   벽(방울)에 닿지 않고 검은 볼을 끝까지 드래그.
--------------------------------------------------------- */
PZ.M2_BELLS = { node:'corridor-1', enter(){ return new Promise(resolve => {
  setScene('corridor-1', corridorMock({ bells:true }));
  pzStage(`
    <div class="pz-title">MISSION · 방울길</div>
    <canvas id="m2cv" style="position:absolute;left:4%;right:4%;top:13%;bottom:17%;width:92%;height:70%"></canvas>
    <div class="pz-help">스치기만 해도 울린다. 손을 떼면 그 자리에서 멈춘다.</div>`);
  const cv = $('#m2cv');
  const C = fitCanvas(cv);
  const W = C.w, H = C.h;
  /* 안전 경로 — 더 길고 꺾임이 많다 */
  const pts = [
    { x:W*0.50, y:H*0.97 },
    { x:W*0.17, y:H*0.86 },
    { x:W*0.80, y:H*0.75 },
    { x:W*0.20, y:H*0.63 },
    { x:W*0.78, y:H*0.51 },
    { x:W*0.22, y:H*0.38 },
    { x:W*0.76, y:H*0.25 },
    { x:W*0.50, y:H*0.05 }
  ];
  const ROAD = Math.max(28, W*0.082);   /* 통로 폭 (난이도 하향 : 0.070 → 0.082) */
  const BALL = 5.5;
  /* 통로를 더 조이는 돌출부 */
  const pinch = [];
  for(let i=1;i<pts.length;i++){
    const a = pts[i-1], b = pts[i];
    const len = Math.hypot(b.x-a.x, b.y-a.y);
    const nx = -(b.y-a.y)/len, ny = (b.x-a.x)/len;
    const side = (i % 2) ? 1 : -1;
    [0.38, 0.70].forEach((t, k) => {
      const px = a.x + (b.x-a.x)*t, py = a.y + (b.y-a.y)*t;
      const s = k ? -side : side;
      pinch.push({ x: px + nx*s*(ROAD*0.64), y: py + ny*s*(ROAD*0.64), r: ROAD*0.28 });
    });
  }
  /* 판정 마스크 */
  const mask = document.createElement('canvas');
  mask.width = Math.round(W); mask.height = Math.round(H);
  const mx = mask.getContext('2d');
  mx.fillStyle = '#fff'; mx.strokeStyle = '#fff';
  mx.lineWidth = ROAD; mx.lineCap = 'round'; mx.lineJoin = 'round';
  mx.beginPath(); mx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) mx.lineTo(pts[i].x, pts[i].y);
  mx.stroke();
  mx.beginPath(); mx.arc(pts[0].x, pts[0].y, ROAD*0.95, 0, Math.PI*2); mx.fill();          /* 출발 여유 */
  mx.beginPath(); mx.arc(pts[pts.length-1].x, pts[pts.length-1].y, ROAD*0.8, 0, Math.PI*2); mx.fill();
  mx.globalCompositeOperation = 'destination-out';
  pinch.forEach(p => { mx.beginPath(); mx.arc(p.x, p.y, p.r, 0, Math.PI*2); mx.fill(); });
  mx.globalCompositeOperation = 'source-over';
  const mdata = mx.getImageData(0,0,mask.width,mask.height).data;
  const inRoad = (x,y) => {
    if(x<0||y<0||x>=mask.width||y>=mask.height) return false;
    return mdata[((y|0)*mask.width + (x|0))*4 + 3] > 128;   /* 경계에 스치면 바로 실패 */
  };
  /* 중심 + 둘레 8방향 전부 통로 안이어야 통과 */
  const clearAt = (x,y) => {
    if(!inRoad(x,y)) return false;
    for(let a=0;a<8;a++){
      const th = a*Math.PI/4;
      if(!inRoad(x + Math.cos(th)*BALL, y + Math.sin(th)*BALL)) return false;
    }
    return true;
  };
  /* 방울 : 벽을 따라 촘촘하게 */
  const bells = [];
  for(let i=1;i<pts.length;i++){
    const a = pts[i-1], b = pts[i];
    const len = Math.hypot(b.x-a.x, b.y-a.y), n = Math.max(4, Math.round(len/20));
    const nx = -(b.y-a.y)/len, ny = (b.x-a.x)/len;
    for(let k=0;k<=n;k++){
      const t = k/n, px = a.x + (b.x-a.x)*t, py = a.y + (b.y-a.y)*t;
      bells.push({ x:px + nx*(ROAD/2+4), y:py + ny*(ROAD/2+4), p:0 });
      bells.push({ x:px - nx*(ROAD/2+4), y:py - ny*(ROAD/2+4), p:0 });
    }
  }
  pinch.forEach(p => bells.push({ x:p.x, y:p.y, p:0, big:true }));
  let ball = { x:pts[0].x, y:pts[0].y }, dragging = false, failed = false, done = false;
  const draw = () => {
    C.ctx.clearRect(0,0,W,H);
    C.ctx.fillStyle = 'rgba(4,9,8,.86)'; C.ctx.fillRect(0,0,W,H);
    /* 길 */
    C.ctx.save();
    C.ctx.strokeStyle = 'rgba(120,210,195,.13)'; C.ctx.lineWidth = ROAD; C.ctx.lineCap='round'; C.ctx.lineJoin='round';
    C.ctx.beginPath(); C.ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) C.ctx.lineTo(pts[i].x, pts[i].y);
    C.ctx.stroke();
    C.ctx.strokeStyle = 'rgba(150,235,220,.26)'; C.ctx.lineWidth = 1; C.ctx.stroke();
    C.ctx.restore();
    /* 돌출부(벽) */
    pinch.forEach(p => {
      C.ctx.beginPath(); C.ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      C.ctx.fillStyle = 'rgba(4,9,8,.95)'; C.ctx.fill();
      C.ctx.strokeStyle = 'rgba(150,200,190,.18)'; C.ctx.lineWidth = 1; C.ctx.stroke();
    });
    /* 방울 */
    bells.forEach(b => {
      C.ctx.beginPath(); C.ctx.arc(b.x, b.y, b.big ? 5.4 : 3.8, 0, Math.PI*2);
      C.ctx.fillStyle = b.p > 0 ? 'rgba(255,190,120,.95)' : 'rgba(190,205,185,.5)';
      C.ctx.fill();
      if(b.p > 0) b.p -= 0.06;
    });
    /* 도착 지점 */
    C.ctx.beginPath(); C.ctx.arc(pts[pts.length-1].x, pts[pts.length-1].y, ROAD*0.7, 0, Math.PI*2);
    C.ctx.fillStyle = 'rgba(110,235,200,.14)'; C.ctx.fill();
    /* 볼 */
    C.ctx.beginPath(); C.ctx.arc(ball.x, ball.y, BALL, 0, Math.PI*2);
    C.ctx.fillStyle = failed ? '#ff6161' : '#0c1211';
    C.ctx.fill();
    C.ctx.lineWidth = 1.6; C.ctx.strokeStyle = failed ? '#ff9c9c' : 'rgba(180,235,225,.8)'; C.ctx.stroke();
    if(!done && document.body.contains(cv)) requestAnimationFrame(draw);
  };
  draw();
  const toStart = () => { ball = { x:pts[0].x, y:pts[0].y }; };
  const fail = () => {
    if(failed) return;
    failed = true; dragging = false;
    bells.forEach(b => b.p = 1);
    AudioFX.bell(1.6);
    S.wrongCounts.M2 = (S.wrongCounts.M2||0) + 1; save();
    ghostGrab({ toast:'끌려갈 뻔했다 — 처음부터' }).then(()=>{
      if(done || !document.body.contains(cv)) return;
      toStart(); failed = false;
    });
  };
  const succeed = () => {
    done = true; dragging = false;
    AudioFX.unlock(); toast('통로 끝 — 방울이 없다');
    setTimeout(()=>{ clearPZ(); resolve(); }, 700);
  };
  const move = e => {
    if(!dragging || failed || done) return;
    const p = ptIn(e, cv);
    const from = ball;
    /* 빠르게 그어 벽을 건너뛰지 못하도록 이동 구간을 잘게 나눠 전부 검사 */
    const dist = Math.hypot(p.x-from.x, p.y-from.y);
    const steps = Math.max(1, Math.ceil(dist/2.5));
    const end = pts[pts.length-1];
    for(let s=1;s<=steps;s++){
      const q = { x: from.x + (p.x-from.x)*s/steps, y: from.y + (p.y-from.y)*s/steps };
      ball = q;
      bells.forEach(b => { if(Math.hypot(b.x-q.x, b.y-q.y) < 16) b.p = Math.max(b.p, .75); });
      if(!clearAt(q.x, q.y)){ fail(); return; }
      if(Math.hypot(q.x-end.x, q.y-end.y) < ROAD*0.55){ succeed(); return; }
    }
  };
  cv.addEventListener('pointerdown', e => {
    const p = ptIn(e, cv);
    if(Math.hypot(p.x-ball.x, p.y-ball.y) < 38){ dragging = true; cv.setPointerCapture(e.pointerId); AudioFX.click(); }
  });
  cv.addEventListener('pointermove', move);
  const release = () => {
    if(!dragging || done) return;
    dragging = false;
    if(!failed) toast('멈췄다 — 다시 잡고 이어서');   /* 손을 떼도 그 자리에서 재시작 */
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  /* 개발 테스트용 훅 (?debug=1 일 때만) */
  if(typeof DEBUG !== 'undefined' && DEBUG) window.__m2 = {
    W, H, ROAD, BALL, pts, clearAt,
    at: () => ({ x: ball.x, y: ball.y, failed, done })
  };
});}};
/* =========================================================
   PART 6 — 퍼즐 C : MISSION3 블록쌓기 / QUIZ3 노트 / QUIZ4 노트2 / MISSION4 촛불모스
   ========================================================= */

/* ---------------------------------------------------------
   MISSION 3 — 이상한 문 앞 「쌓아 올리기」  (물리 엔진 · matter-js)
   놓으면 실제로 떨어진다. 제각각인 잔해가 흔들리고 미끄러지고 무너진다.
   탑이 높아지면 카메라가 따라 올라가므로 낙하 높이는 항상 일정하다.
--------------------------------------------------------- */
PZ.M3_BLOCKS = { node:'odd-door', enter(){ return new Promise(resolve => {
  setScene('odd-door', MOCK.debrisRoom());
  pzStage(`
    <div class="pz-title">MISSION · 쌓아 올리기</div>
    <canvas id="m3cv" style="position:absolute;left:4%;right:4%;top:10%;bottom:21%;width:92%;height:69%"></canvas>
    <div style="position:absolute;left:0;right:0;bottom:12.5%;display:flex;gap:9px;justify-content:center;z-index:6">
      <button class="btn" id="m3rot" style="padding:9px 15px;font-size:13px">돌리기</button>
      <button class="btn" id="m3drop" style="padding:9px 17px;font-size:13px">놓기</button>
    </div>
    <div class="pz-help">끌어서 자리를 잡고 놓으면 그대로 떨어진다 · 남은 잔해 <b id="m3n">0</b></div>`);

  const M = window.Matter;
  const cv = $('#m3cv'), C = fitCanvas(cv), W = C.w, H = C.h;
  const FLOOR_Y = H - 12;          /* 바닥 (월드 좌표) */
  const TARGET_H = 250;            /* 창문까지 필요한 높이 */
  const GOAL_Y = FLOOR_Y - TARGET_H;
  const DROP_H = 100;              /* 탑 꼭대기에서 이만큼 위에서 떨어뜨린다 */
  const TOTAL = 20;

  const engine = M.Engine.create();
  engine.gravity.y = 1.0;
  engine.positionIterations = 8;
  engine.velocityIterations = 8;
  engine.enableSleeping = true;
  const world = engine.world;
  const wallOpt = { isStatic:true, friction:.95, restitution:0 };
  M.Composite.add(world, [
    M.Bodies.rectangle(W/2, FLOOR_Y + 30, W*1.6, 60, wallOpt),   /* 바닥 */
    M.Bodies.rectangle(-40, FLOOR_Y - H*2, 60, H*6, wallOpt),    /* 좌벽 (위로 길게) */
    M.Bodies.rectangle(W+40, FLOOR_Y - H*2, 60, H*6, wallOpt)    /* 우벽 */
  ]);

  const PIECE_OPT = { friction:.92, frictionStatic:1.3, restitution:0, density:.002, slop:.02 };
  const rnd = (a,b) => a + Math.random()*(b-a);
  let pieces = [], cur = null, left = TOTAL, settle = 0, waitT = 0,
      done = false, waiting = false, lastThud = 0, camY = 0, bellLv = 0, bellIv = null;

  /* 쌓인 더미의 최고점 (놓인 조각만) */
  const towerTop = () => {
    let top = FLOOR_Y;
    pieces.forEach(b => { if(!b.isStatic) top = Math.min(top, b.bounds.min.y); });
    return top;
  };
  const holdY = () => Math.min(towerTop() - DROP_H, FLOOR_Y - DROP_H);
  const wantCam = () => Math.min(0, towerTop() - H*0.52);   /* 탑이 높아지면 시야가 따라 올라간다 */

  const makePiece = (y) => {
    const t = Math.random(); let b;
    if(t < .40)      b = M.Bodies.rectangle(W/2, y, rnd(48,94), rnd(26,44), PIECE_OPT);              /* 각목·나무상자 */
    else if(t < .70) b = M.Bodies.trapezoid(W/2, y, rnd(46,82), rnd(30,46), rnd(.12,.42), PIECE_OPT); /* 기울어진 잔해 */
    else if(t < .88) b = M.Bodies.polygon(W/2, y, 5 + (Math.random()*3|0), rnd(20,32), PIECE_OPT);   /* 울퉁불퉁한 덩어리 */
    else             b = M.Bodies.rectangle(W/2, y, rnd(72,116), rnd(14,20), PIECE_OPT);             /* 얇고 긴 널빤지 */
    M.Body.setAngle(b, rnd(-0.10, 0.10));
    return b;
  };
  const updateN = () => { if($('#m3n')) $('#m3n').textContent = String(left); };
  const spawn = () => {
    if(done) return;
    cur = makePiece(holdY());
    M.Body.setStatic(cur, true);
    M.Composite.add(world, cur);
    pieces.push(cur);
    waiting = false; settle = 0; waitT = 0;
    updateN();
  };
  const clearAll = () => { pieces.forEach(b => M.Composite.remove(world, b)); pieces = []; cur = null; };
  const resetRun = () => {
    S.wrongCounts.M3 = (S.wrongCounts.M3 || 0) + 1; save();
    clearAll(); left = TOTAL; camY = 0; bellLv = 0; updateN();
    /* 끼아악 — 귀신을 마주하고 처음부터 */
    ghostGrab({ scream:true, toast:'무너졌다 — 다시' }).then(()=>{
      if(!done && document.body.contains(cv)) spawn();
    });
  };
  const settled = () => pieces.every(b => b.isStatic || b.isSleeping || (b.speed < .5 && b.angularSpeed < .05));

  M.Events.on(engine, 'collisionStart', ev => {
    const now = Date.now();
    if(now - lastThud < 90) return;
    let hard = false;
    ev.pairs.forEach(p => { if((p.bodyA.speed||0) + (p.bodyB.speed||0) > 2.2) hard = true; });
    if(hard){ lastThud = now; AudioFX.noise(.12, .12, 260, 'lowpass', true); }
  });

  const drop = () => {
    if(done || !cur) return;
    AudioFX.click();
    M.Body.setStatic(cur, false);
    M.Sleeping.set(cur, false);
    M.Body.setVelocity(cur, { x:0, y:0 });
    M.Body.setAngularVelocity(cur, rnd(-0.03, 0.03));
    cur = null; left--; updateN();
    waiting = true; settle = 0; waitT = 0;
  };
  $('#m3drop').onclick = drop;
  $('#m3rot').onclick = () => { if(cur){ AudioFX.click(); M.Body.setAngle(cur, cur.angle + Math.PI/9); } };

  let dragging = false;
  const moveCur = e => {
    if(!cur) return;
    const p = ptIn(e, cv);
    M.Body.setPosition(cur, { x: clamp(p.x, 24, W-24), y: holdY() });
  };
  cv.addEventListener('pointerdown', e => { if(!cur) return; dragging = true; cv.setPointerCapture(e.pointerId); moveCur(e); });
  cv.addEventListener('pointermove', e => { if(dragging) moveCur(e); });
  const upH = () => dragging = false;
  cv.addEventListener('pointerup', upH);
  cv.addEventListener('pointercancel', upH);

  const drawBody = (b, held) => {
    const v = b.vertices;
    C.ctx.beginPath(); C.ctx.moveTo(v[0].x, v[0].y);
    for(let i=1;i<v.length;i++) C.ctx.lineTo(v[i].x, v[i].y);
    C.ctx.closePath();
    C.ctx.fillStyle = held ? 'rgba(198,244,230,.92)' : 'rgba(118,158,148,.86)';
    C.ctx.fill();
    C.ctx.lineWidth = 1.2;
    C.ctx.strokeStyle = held ? 'rgba(240,255,250,.9)' : 'rgba(205,240,232,.38)';
    C.ctx.stroke();
  };
  const loop = () => {
    if(done || !document.body.contains(cv)) return;
    M.Engine.update(engine, 1000/60);
    /* 떠 있는 조각은 항상 탑 위 일정 높이에 */
    if(cur) M.Body.setPosition(cur, { x: cur.position.x, y: holdY() });
    camY += (wantCam() - camY) * 0.08;

    C.ctx.clearRect(0,0,W,H);
    C.ctx.fillStyle = 'rgba(4,9,8,.55)'; C.ctx.fillRect(0,0,W,H);

    C.ctx.save();
    C.ctx.translate(0, -camY);                     /* 카메라 */
    /* 바닥 */
    C.ctx.fillStyle = 'rgba(30,48,44,.9)';
    C.ctx.fillRect(0, FLOOR_Y, W, H + Math.abs(camY) + 60);
    /* 창문(목표) */
    C.ctx.fillStyle = 'rgba(150,210,235,.10)';
    C.ctx.fillRect(W*0.56, GOAL_Y - 44, W*0.40, 44);
    C.ctx.strokeStyle = 'rgba(170,225,235,.45)'; C.ctx.lineWidth = 1;
    C.ctx.strokeRect(W*0.56, GOAL_Y - 44, W*0.40, 44);
    C.ctx.setLineDash([5,5]); C.ctx.strokeStyle = 'rgba(170,225,235,.3)';
    C.ctx.beginPath(); C.ctx.moveTo(0, GOAL_Y); C.ctx.lineTo(W, GOAL_Y); C.ctx.stroke();
    C.ctx.setLineDash([]);
    C.ctx.fillStyle = 'rgba(170,220,230,.6)'; C.ctx.font = '10px system-ui';
    C.ctx.fillText('창문', W*0.56, GOAL_Y - 50);
    /* 조각 */
    pieces.forEach(b => drawBody(b, b === cur));
    /* 낙하 예상선 */
    if(cur){
      C.ctx.setLineDash([3,4]); C.ctx.strokeStyle = 'rgba(200,255,245,.35)';
      C.ctx.beginPath(); C.ctx.moveTo(cur.position.x, cur.position.y + 18);
      C.ctx.lineTo(cur.position.x, towerTop()); C.ctx.stroke();
      C.ctx.setLineDash([]);
    }
    C.ctx.restore();

    /* HUD — 높이 게이지(화면 고정) */
    const prog = clamp((FLOOR_Y - towerTop()) / TARGET_H, 0, 1);
    C.ctx.fillStyle = 'rgba(255,255,255,.12)'; C.ctx.fillRect(W-14, 14, 6, H-28);
    C.ctx.fillStyle = 'rgba(103,232,198,.85)';
    C.ctx.fillRect(W-14, 14 + (H-28)*(1-prog), 6, (H-28)*prog);

    /* 안정 판정 */
    if(waiting){
      waitT += 1/60;
      if(settled() || waitT > 5){
        settle += 1/60;
        if(settle > .6 || waitT > 5){
          waiting = false;
          if(towerTop() <= GOAL_Y){
            done = true;
            if(bellIv){ clearInterval(bellIv); bellIv = null; }
            AudioFX.unlock(); toast('창문까지 닿았다');
            setTimeout(()=>{ clearPZ(); resolve(); }, 900);
            return;
          }
          if(left > 0) spawn(); else resetRun();
        }
      }else settle = 0;
    }
    requestAnimationFrame(loop);
  };
  spawn(); loop();
  /* 10초마다 방울 소리가 점점 가까워진다 */
  bellIv = setInterval(() => {
    if(done || !document.body.contains(cv)){ clearInterval(bellIv); bellIv = null; return; }
    bellLv++;
    AudioFX.bell(Math.min(1 + bellLv*0.55, 3.6));
    if(bellLv >= 3) vibrate(40);
    if(bellLv >= 5){ redpulse(); shake(false); }
    if(bellLv === 1) toast('어디선가 방울 소리', 1200);
    else if(bellLv === 3) toast('방울 소리가 가까워진다', 1200);
    else if(bellLv >= 5) toast('바로 뒤다', 1100);
  }, 10000);
  /* 개발 테스트용 훅 (?debug=1 일 때만) */
  if(typeof DEBUG !== 'undefined' && DEBUG) window.__m3 = {
    drop, rot: () => $('#m3rot').onclick(),
    starve: () => { left = 1; updateN(); },
    moveTo: x => { if(cur) M.Body.setPosition(cur, { x: clamp(x, 24, W-24), y: holdY() }); },
    state: () => {
      let topB = null;
      pieces.forEach(b => { if(!b.isStatic && (!topB || b.bounds.min.y < topB.bounds.min.y)) topB = b; });
      return { left, top: towerTop(), goal: GOAL_Y, cur: !!cur, waiting, camY,
               holdY: holdY(), topX: topB ? topB.position.x : W/2, floor: FLOOR_Y };
    }
  };
});}};

/* ---------- 한글 조합기 (초성/중성/종성) ---------- */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function syl(c, v, t){
  const ci = CHO.indexOf(c), vi = JUNG.indexOf(v), ti = t ? JONG.indexOf(t) : 0;
  if(ci < 0 || vi < 0 || ti < 0) return '?';
  return String.fromCharCode(0xAC00 + (ci*21 + vi)*28 + ti);
}
/* 7자소 → 3글자 (3+2+2) */
function composeSeven(j){
  const out = [];
  if(j[0] && j[1]) out.push(syl(j[0], j[1], j[2]));
  if(j[3] && j[4]) out.push(syl(j[3], j[4]));
  if(j[5] && j[6]) out.push(syl(j[5], j[6]));
  return out.join('');
}

  const scene = $('#m5scene'), gap = $('#m5gapbar i'), prog = $('#m5prog i');
  let player = 0, ghost = 0, holding = false, turnT = 0, lastFlinch = -9, t0 = performance.now(), last = t0, done = false;
  const PLAYER_SEC = 30, GHOST_SEC = 20, FLINCH = 0.08, FLINCH_CD = 0.7, TURN_DELAY = 0.35;
  AudioFX.heartbeat(70);
  const render = (lookBack) => {
    if(lookBack){
      scene.innerHTML = bg('cf-ghost-silhouette', corridorMock({ ghost: clamp(0.12 + ghost*0.88, 0, 1) }), { tone:'red' });
    }else{
      scene.innerHTML = bg('cf-wide', corridorMock({ doorEnd:true, depth: 7 }));
      const d = scene.querySelector('.scene-bg');
      if(d) d.style.transform = `scale(${1.04 + player*0.5})`;
    }
  };
  render(false);
  const cleanup = () => {
    done = true; AudioFX.stopHeart();
    $('#pzlayer').removeEventListener('pointerdown', down);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
  };
  const tick = (now) => {
    if(done) return;
    if(!document.body.contains(scene)){ cleanup(); return; }   /* 씬이 사라졌으면 루프 종료 */
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    if(holding){
      if(turnT > 0){ turnT -= dt; }
      else{
        player += dt / PLAYER_SEC;
        ghost  += dt / GHOST_SEC;
        if(Math.random() < dt*3.2) AudioFX.step();
      }
    }
    prog.style.width = (clamp(player,0,1)*100) + '%';
    const g = clamp(1 - ghost, 0, 1);
    gap.style.width = (g*100) + '%';
    $('#m5gapbar').classList.toggle('danger', g < 0.35);
    if(g < 0.3 && Math.random() < dt*2.2){ redpulse(); AudioFX.breath(); }

        requestAnimationFrame(tick);
      }, 1200);
      return;
    }
    if(player >= 1){
      cleanup(); AudioFX.unlock();
      scene.innerHTML = bg('cf-door102', corridorMock({ doorEnd:true, depth:4 }));
      toast('102호 — 문 앞에 섰다');
      setTimeout(()=>{ clearPZ(); resolve(); }, 1200);
      return;
    }
    requestAnimationFrame(tick);
  };

    if(e.target.closest('.btn')) return;
    holding = true; turnT = TURN_DELAY; render(false);

    if(!holding) return;

});}};

/* ---------- 러너 ---------- */
/* 개발 전용 : ?debug=1 이면 퍼즐 강제 통과 버튼/단축키(S) 활성화 */
const DEBUG = /[?&]debug=1/.test(location.search);
function pzRun(id){
  const p = PZ[id].enter();
  if(!DEBUG) return p;
  return Promise.race([p, new Promise(res => {
    const h = e => { if(e.key === 's' || e.key === 'S'){ cleanup(); res('skip'); } };
    const btn = document.createElement('button');
    btn.className = 'btn'; btn.id = 'dbgskip'; btn.textContent = 'SKIP';
    btn.style.cssText = 'position:absolute;left:10px;bottom:16px;z-index:88;opacity:.55;font-size:11px;padding:6px 10px';
    btn.onclick = () => { cleanup(); res('skip'); };
    const cleanup = () => { window.removeEventListener('keydown', h); btn.remove(); clearPZ(); };
    window.addEventListener('keydown', h);
    $('#phone').appendChild(btn);
    p.then(() => { window.removeEventListener('keydown', h); btn.remove(); });
  })]);
}
let running = false;
async function runFrom(i){
  if(running) return;
  running = true;
  for(S.i = i; S.i < TIMELINE.length; S.i++){
    save();
    const e = TIMELINE[S.i];
    clearPZ(); clearSub(); showTapHint(false);
    try{
      if(e.pre) await e.pre();
      if(e.pz) await pzRun(e.pz);
      if(e.post) await e.post();
      if(e.run) await e.run();
    }catch(err){
      console.error('[node error]', e.node, err);
      toast('오류가 발생했습니다 — 다음으로 넘어갑니다');
      await wait(800);
    }
    clearPZ();
  }
  running = false;
}

/* ---------- 부팅 ---------- */
(function boot(){
  const hasSave = (() => { try{ const d = JSON.parse(localStorage.getItem(KEY_SAVE)); return d && d.i > 0; }catch(e){ return false; } })();
  if(hasSave) $('#btnCont').style.display = '';
  const start = (cont) => {
    AudioFX.init(); AudioFX.resume();
    let from = 0;
    if(cont && load()) from = clamp(S.i, 0, TIMELINE.length - 1);
    else { wipe(); S = { i:0, step:0, flags:{}, wrongCounts:{}, dirHistory:{}, items:[], battery:87, recSec:0, cleared:false }; }
    if(S.items.length) $('#bagbtn').classList.add('on');
    if(from > 0) startRec();
    $('#title').style.display = 'none';
    runFrom(from);
  };
  $('#btnNew').onclick = () => { AudioFX.init(); AudioFX.click(); start(false); };
  $('#btnCont').onclick = () => { AudioFX.init(); AudioFX.click(); start(true); };
  /* 모바일 키보드가 화면을 밀어올리는 것 방지 */
  window.addEventListener('focusout', () => setTimeout(()=>window.scrollTo(0,0), 50));
  if(window.visualViewport) window.visualViewport.addEventListener('resize', () => window.scrollTo(0,0));
  /* 디버그: ?node=12 로 특정 노드부터 시작 */
  const m = location.search.match(/node=(\d+)/);
  if(m){ window.__DEBUG_START = +m[1]; $('#btnNew').textContent = '노드 ' + m[1] + '부터';
    $('#btnNew').onclick = () => { AudioFX.init(); wipe();
      S = { i:+m[1], step:0, flags:{}, wrongCounts:{}, dirHistory:{}, items:['morse','photo','note'], battery:87, recSec:0, cleared:false };
      $('#bagbtn').classList.add('on'); startRec(); $('#title').style.display='none'; runFrom(+m[1]); }; }
})();
</script>
